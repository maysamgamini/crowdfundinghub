# Replicated profile: every module database is a two-node Patroni cluster (primary + synchronous standby),
# and a shared three-member etcd group is the witness that decides which node may be primary.
# Start it with:  docker compose -f docker-compose.ha.yml up -d
# Needs roughly 6 GB of memory for the container VM (Colima: colima start --memory 8).
x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.16
  restart: unless-stopped
x-pg: &pg
  image: ghcr.io/zalando/spilo-16:3.3-p1
  restart: unless-stopped
  depends_on: [etcd1, etcd2, etcd3]
services:
  etcd1:
    <<: *etcd
    command: >
      etcd --name etcd1 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd1:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd1:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --initial-cluster-token crowdfunding-witness
    volumes: [etcd1_data:/etcd-data]
  etcd2:
    <<: *etcd
    command: >
      etcd --name etcd2 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd2:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd2:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --initial-cluster-token crowdfunding-witness
    volumes: [etcd2_data:/etcd-data]
  etcd3:
    <<: *etcd
    command: >
      etcd --name etcd3 --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379 --advertise-client-urls http://etcd3:2379
      --listen-peer-urls http://0.0.0.0:2380 --initial-advertise-peer-urls http://etcd3:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380 --initial-cluster-state new --initial-cluster-token crowdfunding-witness
    volumes: [etcd3_data:/etcd-data]
  identity-a:
    <<: *pg
    hostname: identity-a
    ports: ["6000:5432"]
    environment:
      SCOPE: identity
      PGVERSION: "16"
      ETCD3_HOSTS: "etcd1:2379,etcd2:2379,etcd3:2379"
      PGPASSWORD_SUPERUSER: postgres
      PGPASSWORD_ADMIN: postgres
      PGPASSWORD_STANDBY: standby
      SPILO_CONFIGURATION: |
        bootstrap:
          dcs:
            synchronous_mode: true
            synchronous_mode_strict: true
            postgresql:
              parameters:
                synchronous_commit: remote_apply
          post_init: /scripts/create-module-database.sh identity_db
    volumes:
      - identity_a_data:/home/postgres/pgdata
      - ./deploy/ha/create-module-database.sh:/scripts/create-module-database.sh:ro
  identity-b:
