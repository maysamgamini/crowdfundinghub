services:
  crowdfunding-db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${CF_PG_PORT:-5432}:5432"
    volumes:
      - crowdfunding_postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init-module-databases.sh:/docker-entrypoint-initdb.d/10-module-databases.sh:ro

  crowdfunding-redis:
    image: redis:7-alpine
    ports:
      - "${CF_REDIS_PORT:-6379}:6379"

volumes:
  crowdfunding_postgres_data:
