services:
  crowdfunding-db:
    image: postgres:16
    container_name: crowdfunding-db
    environment:
      POSTGRES_DB: crowdfundingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - crowdfunding_postgres_data:/var/lib/postgresql/data

  crowdfunding-redis:
    image: redis:7-alpine
    container_name: crowdfunding-redis
    ports:
      - "6379:6379"

volumes:
  crowdfunding_postgres_data:
