services:
  crowdfunding-db:
    image: postgres:16
    container_name: crowdfunding-db
    environment:
      POSTGRES_DB: crowdfundingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - crowdfunding_postgres_data:/var/lib/postgresql/data

  crowdfunding-redis:
    image: redis:7-alpine
    container_name: crowdfunding-redis
    ports:
      - "6379:6379"

  # Local OpenTelemetry backend: the .NET Aspire dashboard receives OTLP directly and shows
  # traces, metrics and structured logs at http://localhost:18888. The API exports to it when
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 (set in appsettings.Development.json).
  # Anonymous access and an unauthenticated OTLP endpoint are for local development only.
  crowdfunding-aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: crowdfunding-aspire-dashboard
    environment:
      ASPNETCORE_URLS: http://+:18888
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # Dashboard web UI
      - "4317:18889"  # OTLP gRPC ingestion

volumes:
  crowdfunding_postgres_data:
